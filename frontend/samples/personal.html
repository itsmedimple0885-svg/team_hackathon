<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Personal Work Priority</title>
  <style>
    body{font-family:Segoe UI,Arial;margin:24px}
    .item{border:1px solid #ddd;padding:12px;border-radius:6px;margin-bottom:10px;display:flex;justify-content:space-between}
    .meta{font-size:13px;color:#555}
    .score{width:180px;text-align:right}
    .bar{height:10px;background:#e6e6e6;border-radius:6px;overflow:hidden}
    .bar > span{display:block;height:100%;background:linear-gradient(90deg,#2b8cff,#00c6a7)}
    .actions button{margin-left:8px}
    header{display:flex;justify-content:space-between;align-items:center}
  </style>
</head>
<body>
  <header>
    <h1>Personal Work Priority</h1>
    <div>Owner: Alice Johnson — Capacity: 6h/day</div>
  </header>

  <section id="list">
    <!-- Items injected by script -->
  </section>

  <h3>Workload</h3>
  <div class="bar" style="width:400px"><span style="width:60%"></span></div>
  <div class="meta">Utilization: 60% (3.6 / 6 hrs)</div>

  <script>
    const items = [
      {id:'itm-1',title:'Follow up: VIP client payment',score:92,confidence:0.9,source:'Outlook',due:'2026-09-18'},
      {id:'itm-2',title:'Resolve incident #452 (payments)',score:84,confidence:0.72,source:'Incidents',due:'2026-09-19'},
      {id:'itm-3',title:'Review Jira: FIN-128 change request',score:70,confidence:0.55,source:'Jira',due:'2026-09-25'}
    ];
    const list = document.getElementById('list');
    items.forEach(it=>{
      const el = document.createElement('div'); el.className='item';
      el.innerHTML = `
        <div>
          <strong>${it.title}</strong>
          <div class="meta">Source: ${it.source} • Due: ${it.due}</div>
        </div>
        <div style="min-width:220px;text-align:right">
          <div class="score">Score: ${it.score} <span class="meta">(conf ${Math.round(it.confidence*100)}%)</span></div>
          <div class="bar" style="width:180px;margin-top:6px"><span style="width:${it.score}%"></span></div>
          <div class="actions"><button onclick="alert('Snooze ${it.id}')">Snooze</button><button onclick="location.href='item.html?id='+it.id">Open</button></div>
        </div>
      `;
      list.appendChild(el);
    });
  </script>
</body>
</html>
